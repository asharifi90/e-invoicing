spring.application.name=invoice-service

# Kafka
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.group-id=invoice-service

# Database & HikariCP
spring.datasource.url=jdbc:postgresql://localhost:5432/e_invoice
spring.datasource.username=invoiceUser
spring.datasource.password=invoicePassword
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.pool-name=invoice-hikari-pool
spring.datasource.hikari.maximum-pool-size=10
spring.flyway.enabled=true
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# JWT (demo)
app.jwt.secret=JwtSecretForDemoSpringSecurityIsLongEnough!
app.jwt.expiration-ms=3600000

# Logging with OpenTelemetry TraceId & SpanId
logging.pattern.console=%d{HH:mm:ss.SSS} [%thread] %-5level %logger{36} [trace=%X{traceId},span=%X{spanId}] - %msg%n

# Actuator & Prometheus Metrics
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always
management.metrics.tags.application=${spring.application.name}
management.metrics.distribution.percentiles-histogram.http.server.requests=true
management.metrics.distribution.percentiles-histogram.invoice.e2e.duration=true

# Distributed Tracing (OpenTelemetry -> Jaeger)
management.tracing.enabled=true
management.tracing.sampling.probability=1.0
management.otlp.tracing.endpoint=http://localhost:4318/v1/traces
management.otlp.tracing.transport=http
management.observations.key-values.application=${spring.application.name}
management.otlp.metrics.export.enabled=false
management.opentelemetry.tracing.export.otlp.endpoint=http://localhost:4318/v1/traces