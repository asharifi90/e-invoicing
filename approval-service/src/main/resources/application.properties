
spring.application.name=approval-service
server.port=8082

#Kafka
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=approval-service
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=*
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer


management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=when_authorized
management.metrics.tags.application=${spring.application.name}

# Logging with TraceId & SpanId
logging.pattern.console=%d{HH:mm:ss.SSS} [%thread] %-5level %logger{36} [trace=%X{traceId},span=%X{spanId}] - %msg%n

# Prometheus Histogram
management.metrics.distribution.percentiles-histogram.http.server.requests=true

# Distributed Tracing (OpenTelemetry -> Jaeger)
management.tracing.enabled=true
management.tracing.sampling.probability=0.1
management.otlp.tracing.endpoint=http://localhost:4318/v1/traces
management.otlp.tracing.transport=http
management.observations.key-values.application=${spring.application.name}
management.otlp.metrics.export.enabled=false
management.opentelemetry.tracing.export.otlp.endpoint=http://localhost:4318/v1/traces


spring.threads.virtual.enabled=true
spring.datasource.hikari.maximum-pool-size=15
