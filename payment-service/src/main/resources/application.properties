spring.application.name=payment-service
server.port=8083

#Kafka
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=payment-service
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer

# Provider simulation
app.payment.mode=FAIL
app.payment.slow-ms=3000

# Resilience4j - CircuitBreaker
resilience4j.circuitbreaker.instances.paymentProvider.registerHealthIndicator=true
resilience4j.circuitbreaker.instances.paymentProvider.slidingWindowSize=10
resilience4j.circuitbreaker.instances.paymentProvider.failureRateThreshold=50
resilience4j.circuitbreaker.instances.paymentProvider.waitDurationInOpenState=10s
resilience4j.circuitbreaker.instances.paymentProvider.permittedNumberOfCallsInHalfOpenState=3

# Retry
resilience4j.retry.instances.paymentProvider.maxAttempts=3
resilience4j.retry.instances.paymentProvider.waitDuration=500ms
resilience4j.retry.instances.paymentProvider.enableExponentialBackoff=true
resilience4j.retry.instances.paymentProvider.exponentialBackoffMultiplier=2

# Timelimiter (timeout)
resilience4j.timelimiter.instances.paymentProvider.timeoutDuration=2s
resilience4j.timelimiter.instances.paymentProvider.cancelRunningFuture=true

management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=when_authorized
management.metrics.tags.application=${spring.application.name}

# Database
spring.datasource.url=jdbc:postgresql://localhost:5432/payment
spring.datasource.username=invoiceUser
spring.datasource.password=invoicePassword
spring.datasource.driver-class-name=org.postgresql.Driver
spring.flyway.enabled=true
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false


